<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Модель данных Slotly</title><desc id="desc">Услуга связана со слотами, слот с записями, а запись с результатом ключа идемпотентности.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#18313b}.name{font-size:16px;font-weight:700}.field{font-size:12px;fill:#566a70}.box{fill:#fbfcfb;stroke:#78959a;stroke-width:2}.accent{fill:#e1f1ed;stroke:#007c78;stroke-width:3}.rel{stroke:#007c78;stroke-width:2.5;fill:none}.card{fill:#007c78}.cardtext{font-size:11px;fill:white;font-weight:700}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#007c78"/></marker></defs>
  <rect width="960" height="360" fill="#fbfcfb" rx="16"/><text x="48" y="48" class="name" font-size="22">Модель данных · ключевые связи MVP</text><text x="48" y="70" class="field">Ограничения БД поддерживают правила бронирования, а не заменяют API-валидацию</text>
  <rect x="70" y="135" width="175" height="130" rx="12" class="box"/><rect x="70" y="135" width="175" height="36" rx="12" class="card"/><text x="93" y="158" class="cardtext">service</text><text x="90" y="197" class="field">id · name · duration</text><text x="90" y="220" class="field">is_active</text>
  <rect x="390" y="115" width="190" height="170" rx="12" class="accent"/><rect x="390" y="115" width="190" height="36" rx="12" class="card"/><text x="418" y="138" class="cardtext">slot</text><text x="410" y="178" class="field">id · service_id · specialist_id</text><text x="410" y="201" class="field">starts_at · ends_at · published</text><text x="410" y="239" class="field">no overlapping slots per specialist</text>
  <rect x="710" y="135" width="175" height="130" rx="12" class="box"/><rect x="710" y="135" width="175" height="36" rx="12" class="card"/><text x="735" y="158" class="cardtext">appointment</text><text x="730" y="197" class="field">id · slot_id · client_id</text><text x="730" y="220" class="field">status · cancelled_at</text>
  <path d="M245 200 H380" class="rel" marker-end="url(#arrow)"/><text x="290" y="189" class="field">1 : N</text><path d="M580 200 H700" class="rel" marker-end="url(#arrow)"/><text x="625" y="189" class="field">1 : N</text>
  <text x="620" y="305" class="field">partial UNIQUE: one CONFIRMED per slot</text>
</svg>
